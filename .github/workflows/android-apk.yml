name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
    inputs:
      repair_update_manifest:
        description: Restore the known previous update manifest only if missing or from the rejected APK
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: android-apk-${{ github.ref }}-${{ inputs.repair_update_manifest && 'repair' || 'build' }}
  cancel-in-progress: true
jobs:
  repair_update_manifest:
    if: ${{ inputs.repair_update_manifest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous compatible update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python mobile/tool/repair_update_manifest.py
  android:
    if: ${{ !inputs.repair_update_manifest }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore test signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chatai-android-debug-signing-v1
      - name: Prepare test signing identity
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Check published update signing identity
        run: python mobile/tool/check_test_signer.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Prepare Android project
        working-directory: mobile
        run: python tool/prepare_android.py
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze and test
        env:
          CHAT_AI_UI_PREVIEW: "true"
        working-directory: mobile
        run: |
          flutter analyze --no-fatal-infos
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee flutter-test.log
      - name: Publish failed test diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f mobile/flutter-test.log ]; then
            gh release view android-diagnostics >/dev/null 2>&1 || gh release create android-diagnostics --target "$GITHUB_SHA" --prerelease --title "Android build diagnostics" --notes "Flutter test log only; no APK."
            gh release upload android-diagnostics mobile/flutter-test.log --clobber
          fi
      - name: Upload UI preview
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-preview
          path: mobile/build/ui-preview
          if-no-files-found: ignore
      - name: Build installable test APK
        working-directory: mobile
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          flutter build apk --debug --build-name="${version%+*}" --build-number="${version#*+}" --dart-define="CHAT_AI_BUILD=${version#*+}" --dart-define="CHAT_AI_VERSION=${version%+*}" --dart-define="CHAT_AI_COMMIT=${GITHUB_SHA:0:7}"
      - name: Verify APK and publish build identity
        working-directory: mobile
        run: python tool/verify_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChatAI-Android-test-${{ github.run_number }}-${{ github.sha }}
          path: mobile/build/verified-apk/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python mobile/tool/publish_android.py
