name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'work.js'
      - 'server/**'
      - 'scripts/deploy_worker.py'
      - 'tests/test_worker_deploy.py'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Test and deploy work.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Worker and deployment preservation
        run: |
          node --test server/tests/*.test.js tests/test_history_sync.mjs
          python -m unittest discover -s tests -p test_worker_deploy.py -v
      - name: Deploy existing Cloudflare Worker
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME || 'chatai' }}
        run: python scripts/deploy_worker.py
