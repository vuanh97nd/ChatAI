name: chatai_mobile
description: ChatAI Android client for the existing ChatAI server.
publish_to: none
version: 0.8.2+10
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  intl: ^0.20.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  mobile_scanner: ^7.0.1
  flutter_local_notifications: ^19.4.2
  workmanager: 0.9.0
# Keep the federated modules aligned: 0.9.4 has mismatched Apple/interface APIs.
dependency_overrides:
  workmanager_android: 0.9.0
  workmanager_apple: 0.9.0
  workmanager_platform_interface: 0.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/chat_ai.png
