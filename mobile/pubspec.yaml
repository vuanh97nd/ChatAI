name: chatai_mobile
description: ChatAI Android client for the existing ChatAI server.
publish_to: none
version: 1.3.0+63
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.3
  archive: ^4.0.7
  xml: ^6.6.1
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  intl: ^0.20.2
  speech_to_text: ^7.0.0
  record: ^6.1.2
  flutter_tts: ^4.2.2
  audioplayers: ^6.5.1
  flutter_math_fork: ^0.7.4
  markdown: ^7.3.0
  flutter_markdown: ^0.7.7+1
  flutter_svg: ^2.2.1
  mobile_scanner: ^7.0.1
  flutter_local_notifications: ^19.4.2
  workmanager: 0.9.0+3
# Pin the compatible patch set; Android patch fixes dispatcher initialization.
dependency_overrides:
  workmanager_android: 0.9.0+2
  workmanager_apple: 0.9.1+2
  workmanager_platform_interface: 0.9.1+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/chat_ai.png
    - assets/providers/
